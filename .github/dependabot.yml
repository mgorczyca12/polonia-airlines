# The 7-day cooldown limits supply-chain risk from auto-merging freshly published releases.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Keep MassTransit on the Apache-2.0 v8 line rather than commercial v9+.
    ignore:
      - dependency-name: "MassTransit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MassTransit.*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/polonia-web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
