name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: seating_test
          POSTGRES_PASSWORD: seating_test
          POSTGRES_DB: seating_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seating_test -d seating_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: workflow_test
          RABBITMQ_DEFAULT_PASS: workflow_test
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 24
    env:
      SEATING_TEST_POSTGRES: Host=localhost;Database=seating_test;Username=seating_test;Password=seating_test
      SEATING_TEST_REDIS: localhost:6379
      MASSTRANSIT_USAGE_TELEMETRY: "false"
      WORKFLOW_TEST_RABBITMQ_HOST: localhost
      WORKFLOW_TEST_RABBITMQ_PORT: "5672"
      WORKFLOW_TEST_RABBITMQ_USER: workflow_test
      WORKFLOW_TEST_RABBITMQ_PASSWORD: workflow_test
      WORKFLOW_TEST_RABBITMQ_MANAGEMENT: http://localhost:15672/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore polonia-airlines.slnx
      - name: Check backend whitespace
        run: dotnet format whitespace polonia-airlines.slnx --no-restore --verify-no-changes
      - name: Check backend readability rules
        run: dotnet format style polonia-airlines.slnx --diagnostics IDE0011 IDE0021 IDE0022 --no-restore --verify-no-changes
      - run: dotnet build polonia-airlines.slnx --no-restore -c Release
      - run: dotnet test polonia-airlines.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/polonia-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/polonia-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Remove --passWithNoTests once the first frontend test exists.
      - run: pnpm test --passWithNoTests
