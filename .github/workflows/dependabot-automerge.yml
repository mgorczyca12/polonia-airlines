name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Opt-in: set repo variable DEPENDABOT_AUTOMERGE=true only after a ruleset requires CI, or auto-merge merges at once.
    # Actions updates are excluded on purpose: they change what CI executes.
    if: >-
      vars.DEPENDABOT_AUTOMERGE == 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/') ||
       startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Safe on pull_request_target only because no PR code is checked out or run.
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
